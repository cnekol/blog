# 依赖更新：每月一次；小版本与补丁合成一个 PR，大版本单独提 PR。
# 合并前以 CI（lint + build）结果为准。
version: 2
updates:
  - package-ecosystem: npm
    # pnpm workspace 从根目录扫描即可覆盖所有包；所有依赖版本都在 pnpm-workspace.yaml 的 catalog 里
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    groups:
      actions:
        patterns: ['*']
